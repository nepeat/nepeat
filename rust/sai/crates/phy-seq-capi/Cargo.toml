[package]
name = "phy-seq-capi"
description = "C interface of phy-seq (external PHY sequence tables) for the C++ libsai: a static library and phy_seq.h. The only unsafe code of the pair"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "phy_seq_capi"
crate-type = ["staticlib", "rlib"]

[dependencies]
phy-seq.workspace = true

[dev-dependencies]
proptest.workspace = true

[build-dependencies]
# include/phy_seq.h -> the Rust declarations the functions here are checked against
bindgen.workspace = true

[lints]
workspace = true
