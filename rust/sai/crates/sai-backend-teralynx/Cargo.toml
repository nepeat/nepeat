[package]
name = "sai-backend-teralynx"
description = "The Rust SAI's Teralynx 7 backend (CS8210-32X): sai-core's Backend over libifcs 0.12.41 through the ifcs rim, a port of sai-teralynx's C++ IFCS backend. No unsafe code"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sai-core.workspace = true
# SAI_PORT_STAT_* (the counter map), SAI_API_* / SAI_LOG_LEVEL_* (log lines)
sai-sys.workspace = true
ifcs = { path = "../ifcs" }

[dev-dependencies]
# tests/ifcs_e2e: the built libsai driven through its C ABI (the rim crate of the tools)
sai-client = { path = "../sai-client", features = ["mock"] }

[lints]
workspace = true
