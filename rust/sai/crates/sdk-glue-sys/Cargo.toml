[package]
name = "sdk-glue-sys"
description = "Raw C interface of sai-openbcm's sdk_glue.h (the only C file that includes Broadcom SDK headers): declarations only"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
links = "ob_sdk_glue"
build = "build.rs"

[build-dependencies]
bindgen.workspace = true

[features]
# Link the real glue: sdk_glue.c compiled with the SDK's cflags, and libsdk. Paths from
# SDK_GLUE_LINK (build.rs). Only exists for big-endian ppc64. Without it nothing is linked (the
# tests run on sdk-glue's pure-Rust fake).
real = []

[lints]
workspace = true
