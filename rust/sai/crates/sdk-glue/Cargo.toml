[package]
name = "sdk-glue"
description = "Safe wrappers over sai-openbcm's SDK glue (sdk-glue-sys): the only crate that calls it, and the only unsafe code on that side; a pure-Rust fake of the glue"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The real glue (sdk-glue-sys): sdk_glue.c + libsdk, ppc64 only, needs SDK_GLUE_LINK. Without it
# and without rust-fake, a program that uses this crate does not link.
real = ["sdk-glue-sys/real"]
# The pure-Rust fake (module rust_fake). Without the real glue it is also what the plain
# bring-ups use (sdk_glue::fake is then rust_fake::process): no C at all in the program (Miri
# runs it). The tests' glue.
rust-fake = ["dep:signal-hook"]

[dependencies]
sdk-glue-sys.workspace = true
# rust-fake only: the scenario's "sigterm <n>" (raise SIGTERM, as the C fake did), safe API
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
# this crate's own tests: everything against the Rust fake (the process's and per-test chips)
sdk-glue = { path = ".", features = ["rust-fake"] }

[lints]
workspace = true
