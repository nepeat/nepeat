[package]
name = "consoled"
version = "0.1.0"
description = "Serial console server: many serial ports, shared over SSH with one writer and RAM scrollback"
edition = "2024"
license = "MIT"
rust-version = "1.85"
readme = "README.md"

[[bin]]
name = "consoled"
path = "src/bin/consoled.rs"

[[bin]]
name = "line"
path = "src/bin/line.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Its own workspace on purpose: ../Cargo.toml's crates/* share one lock file and fand's
# package source is that whole workspace, so a crate there would rebuild fand (and change
# the AS7760's closure) on every edit here.
[workspace]
