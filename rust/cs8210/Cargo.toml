# The CS8210-32X platform tools: the I2C FPGA's one owner (cage sideband, module
# management, EEPROM/DOM for SONiC and Prometheus) and the LED CPLDs. Design: README.md.
# Its own workspace on purpose (like ../consoled and ../sai): ../Cargo.toml's crates/*
# share one lock file and fand's package source is that whole workspace, so a crate
# there would rebuild fand and change every other board's closure on each edit here.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
cs8210-sys = { path = "crates/cs8210-sys" }
cs8210-xcvr = { path = "crates/cs8210-xcvr" }
libc = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
