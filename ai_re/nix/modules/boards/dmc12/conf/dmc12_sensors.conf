# tmp75 @ 0x49 -- silk-screened U10, sits next to the removable M.2 SSD.
chip "*-i2c-*-49"
label temp1 "M.2 (U10)"

# tmp75 @ 0x48 -- silk-screened U38, sits between the SFP cage and the
# local console port.
chip "*-i2c-*-48"
label temp1 "SFP + Console (U38)"

# lm75 @ 0x4a -- the microcontroller on the K2 SoC card.
chip "*-i2c-*-4a"
label temp1 "K2 SoC (uC)"