[pytest]
# Build tests of everything under nix/ (see nix/README.md, "tests").
python_files = test_*.py
addopts = -ra -p no:cacheprovider --durations=15
markers =
    eval: target evaluates to a drvPath, plus the coverage guards (no building)
    uboot: build every uboot-* output
    packages: build the other package outputs and the non-exported packages / build-time tests
    systems: build NixOS toplevels and images (path:./nix)
    deploy: the root git flake as deploy.sh uses it (tracked files only; with fand)
    vm: NixOS VM tests (need kvm; slow when not cached)
