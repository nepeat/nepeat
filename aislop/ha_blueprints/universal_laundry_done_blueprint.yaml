# Universal Laundry "Machine is Done" blueprint
# One blueprint, instantiated once per appliance (washer, dryer, etc).
# State machine:
#   - watch  : short timer refreshed by each vibration. A 2nd vibration while
#              it's still active => machine confirmed RUNNING (this is the
#              "sustained motion" guard that rejects one-off bumps).
#   - quiet  : per-silence timer. Any vibration while RUNNING restarts it.
#              When it FINISHES => one silent period elapsed.
#   - silent_count : counts consecutive quiet completions without vibration.
#              Needs N silences (default 2) before we call it DONE — so a soak
#              pause (one quiet window) doesn't false-trigger.
#   - bailout : hard cap since RUNNING was confirmed. 10 min fallback so a
#              stalled cycle never hangs forever.
#
# Logic: vibration while running restarts quiet; quiet_done increments
# silent_count; if count>=required or bailout elapsed => DONE; else restart
# quiet for another period. Bailout trigger is the backstop.
#
# AGREED TUNING (2026-08-03, washer quiet tightened 2026-08-15, bailout added 2026-08-15):
#   confirm/arm : 5 min          (set as the WATCH timer duration)
#   washer done : 4 min          (set as the WASHER quiet timer duration) — 2 silent periods required
#   dryer  done : 3 min          (set as the DRYER quiet timer duration) — 1 silent period required
#   bailout     : 10 min         (hard cap since confirmed running)
#
# On DONE: TTS announce (announce_script) + optional Discord @everyone
# (discord_notify -> discord_target).
blueprint:
  name: Universal Laundry Machine Done Notifier
  description: >
    Watches a vibration/motion sensor on a washer or dryer, confirms the
    machine is actually running, then announces when it goes quiet (done).
  domain: automation
  source_url: "https://github.com/nepeat/nepeat/blob/master/aislop/ha_blueprints/universal_laundry_done_blueprint.yaml"
  input:
    vibration_sensor:
      name: Vibration / motion sensor
      description: binary_sensor that fires while the machine is running
      selector:
        entity:
          domain: binary_sensor
    running_helper:
      name: Running helper
      description: input_boolean tracking "machine confirmed running" (create one)
      selector:
        entity:
          domain: input_boolean
    watch_timer:
      name: Confirmation timer
      description: timer whose DURATION you set to your confirm_minutes (create one)
      selector:
        entity:
          domain: timer
    quiet_timer:
      name: Quiet/done timer
      description: timer whose DURATION you set to your quiet_minutes (create one)
      selector:
        entity:
          domain: timer
    silent_count:
      name: Silent period counter
      description: input_number counting consecutive quiet windows (create one)
      selector:
        entity:
          domain: input_number
    bailout_timer:
      name: Bailout timer
      description: timer that hard-caps the cycle length since running confirmed (create one, 10 min)
      selector:
        entity:
          domain: timer
    required_silent_periods:
      name: Required silent periods
      description: how many quiet windows to see before calling done (2 for washer soak tolerance, 1 for dryer)
      default: 2
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
    announce_script:
      name: Announce (TTS) script
      default: script.1714900338808
      selector:
        entity:
          domain: script
    appliance_name:
      name: Appliance display name
      default: The machine
      selector:
        text: {}
    is_washing:
      name: Is this the washing machine?
      description: Controls the verb in the announcement ("washing" vs "drying")
      default: true
      selector:
        boolean: {}
    discord_notify:
      name: Discord notify entity
      description: notify.* entity that posts to a Discord channel
      default: notify.dorkhouse
      selector:
        entity:
          domain: notify
    discord_target:
      name: Discord target
      description: Channel/thread ID to post to
      default: "1277156725622968382"
      selector:
        text: {}
    discord_mention:
      name: Prepend @everyone
      description: Add an @everyone mention to the Discord message
      default: true
      selector:
        boolean: {}

trigger:
  - platform: state
    entity_id: !input vibration_sensor
    to: "on"
    id: vibration
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input watch_timer
    id: watch_done
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input quiet_timer
    id: quiet_done
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input bailout_timer
    id: bailout_done

condition: []

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input vibration_sensor
            state: "on"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input running_helper
                    state: "off"
                sequence:
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: !input watch_timer
                            state: idle
                        sequence:
                          - service: timer.start
                            target:
                              entity_id: !input watch_timer
                      - conditions:
                          - condition: state
                            entity_id: !input watch_timer
                            state: active
                        sequence:
                          - service: timer.cancel
                            target:
                              entity_id: !input watch_timer
                          - service: input_boolean.turn_on
                            target:
                              entity_id: !input running_helper
                          - service: input_number.set_value
                            target:
                              entity_id: !input silent_count
                            data:
                              value: 0
                          - service: timer.start
                            target:
                              entity_id: !input quiet_timer
                          - service: timer.start
                            target:
                              entity_id: !input bailout_timer
              - conditions:
                  - condition: state
                    entity_id: !input running_helper
                    state: "on"
                sequence:
                  - service: timer.start
                    target:
                      entity_id: !input quiet_timer
                  - service: input_number.set_value
                    target:
                      entity_id: !input silent_count
                    data:
                      value: 0
      - conditions:
          - condition: trigger
            id: watch_done
        sequence:
          - service: timer.cancel
            target:
              entity_id: !input watch_timer
      - conditions:
          - condition: trigger
            id: quiet_done
          - condition: state
            entity_id: !input running_helper
            state: "on"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input silent_count
            data:
              value: '{{ [ (states(!input silent_count) | int(0)) + 1, 10 ] | min }}'
          - if:
              - condition: template
                value_template: '{{ states(!input silent_count) | int(0) >= (!input required_silent_periods | int(2)) }}'
            then:
              - service: timer.cancel
                target:
                  entity_id: !input quiet_timer
              - service: timer.cancel
                target:
                  entity_id: !input bailout_timer
              - service: input_boolean.turn_off
                target:
                  entity_id: !input running_helper
              - service: input_number.set_value
                target:
                  entity_id: !input silent_count
                data:
                  value: 0
              - service: !input announce_script
                data:
                  message: >-
                    {% if !input is_washing %}{{ !input appliance_name }} is done washing.{% else %}{{ !input appliance_name }} is done drying.{% endif %}
              - service: !input discord_notify
                data:
                  target:
                    - !input discord_target
                  message: >-
                    {% if !input discord_mention %}@everyone {% endif %}{% if !input is_washing %}{{ !input appliance_name }} is done washing.{% else %}{{ !input appliance_name }} is done drying.{% endif %}
            else:
              - service: timer.start
                target:
                  entity_id: !input quiet_timer
      - conditions:
          - condition: trigger
            id: bailout_done
          - condition: state
            entity_id: !input running_helper
            state: "on"
        sequence:
          - service: timer.cancel
            target:
              entity_id: !input quiet_timer
          - service: timer.cancel
            target:
              entity_id: !input bailout_timer
          - service: input_boolean.turn_off
            target:
              entity_id: !input running_helper
          - service: input_number.set_value
            target:
              entity_id: !input silent_count
            data:
              value: 0
          - service: !input announce_script
            data:
              message: >-
                {% if !input is_washing %}{{ !input appliance_name }} is done washing.{% else %}{{ !input appliance_name }} is done drying.{% endif %}
          - service: !input discord_notify
            data:
              target:
                - !input discord_target
              message: >-
                {% if !input discord_mention %}@everyone {% endif %}{% if !input is_washing %}{{ !input appliance_name }} is done washing.{% else %}{{ !input appliance_name }} is done drying.{% endif %}

mode: single
max_exceeded: silent
